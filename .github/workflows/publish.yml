# 打 tag（v*）即自动发布到 npm。
#
# 发布流程（维护者）：
#   git add -A && git commit -m "..."      # 改完代码
#   pnpm version patch                     # 或 minor / major：改 version、提交、打 tag vX.Y.Z
#   git push --follow-tags                 # 推分支 + 推 tag → 触发本 workflow
#
# ── 认证：二选一 ───────────────────────────────────────────────────────────
#
# A) Trusted Publishing（推荐，无任何长期 token，用 OIDC）：
#    1. 先在本地手动发布一次（包必须已存在于 npm 才能配置发布者）：
#         pnpm publish --access public
#    2. npmjs.com → 该包 → Settings → Trusted Publisher → GitHub Actions，填：
#         Organization or user: BeyondandSharp
#         Repository:            dsh-plugin-notoken
#         Workflow filename:     publish.yml
#         Environment:           （留空）
#    3. 之后的 tag 推送即自动发布，npm 同时会自动附带 provenance 证明。
#    要求 npm CLI ≥ 11.5.1（Node 24 自带）。
#
# B) NPM_TOKEN（不想动 npm 页面设置时用）：
#    1. npmjs.com → Access Tokens → 生成 Granular Access Token（Packages: read+write，
#       勾上 Bypass 2FA，用于 CI）。
#    2. 仓库 Settings → Secrets and variables → Actions → New secret → NPM_TOKEN。
#    3. 把下面的 publish 步骤换成文件末尾注释里的版本（加 registry-url 与 NODE_AUTH_TOKEN）。
#
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 也可以手动触发（补发 / 排障）

permissions:
  contents: read
  id-token: write # OIDC：Trusted Publishing 与 provenance 需要

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不设 registry-url：默认就是 registry.npmjs.org，也避免在 OIDC 模式下引入
      # ${NODE_AUTH_TOKEN} 占位（未设置该变量时 npm 会直接报配置错误）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # tag 必须与 package.json 的 version 一致，避免 v1.2.3 发出一个 1.0.0
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$version  tag=$GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Test
        run: node --test

      - name: Publish
        run: npm publish --access public

